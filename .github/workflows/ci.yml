# Required GitHub Secrets:
# - RENDER_DEPLOY_HOOK: Render service deploy hook URL
# - VERCEL_DEPLOY_HOOK: Vercel project deploy hook URL
name: VENOM CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend Audit And Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      VENOM_API_KEY: test-key
      VENOM_DASHBOARD_SESSION_SECRET: test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Node.js version
        id: node-version
        run: |
          if [ -f ../.nvmrc ]; then
            echo "version=$(cat ../.nvmrc)" >> "$GITHUB_OUTPUT"
          elif [ -f .nvmrc ]; then
            echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            node -e "const pkg=require('./package.json'); const version=(pkg.engines && pkg.engines.node) || '20'; console.log('version=' + version);" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

  dashboard:
    name: Dashboard Lint Type Check And Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      NODE_ENV: test
      VENOM_DASHBOARD_SESSION_SECRET: test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - backend
      - dashboard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy backend to Render
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Backend deployed to Render"

      - name: Deploy dashboard to Vercel
        run: |
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo "Dashboard deployed to Vercel"
