name: VENOM PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-check:
    name: PR Test Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      VENOM_API_KEY: test-key
      VENOM_DASHBOARD_SESSION_SECRET: test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Node.js version
        id: node-version
        run: |
          if [ -f ../.nvmrc ]; then
            echo "version=$(cat ../.nvmrc)" >> "$GITHUB_OUTPUT"
          elif [ -f .nvmrc ]; then
            echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            node -e "const pkg=require('./package.json'); const version=(pkg.engines && pkg.engines.node) || '20'; console.log('version=' + version);" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suites
        id: tests
        continue-on-error: true
        run: |
          set +e
          npm test 2>&1 | tee /tmp/unit.log
          UNIT_EXIT=${PIPESTATUS[0]}

          npm run test:integration 2>&1 | tee /tmp/integration.log
          INT_EXIT=${PIPESTATUS[0]}

          UNIT_COUNT=$(grep -Eo "tests [0-9]+" /tmp/unit.log | tail -1 | awk '{print $2}')
          INT_COUNT=$(grep -Eo "tests [0-9]+" /tmp/integration.log | tail -1 | awk '{print $2}')
          TOTAL_COUNT=$(( ${UNIT_COUNT:-0} + ${INT_COUNT:-0} ))

          if [ "$UNIT_EXIT" -eq 0 ] && [ "$INT_EXIT" -eq 0 ]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "total_tests=$TOTAL_COUNT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "status=FAIL" >> "$GITHUB_OUTPUT"
          echo "total_tests=$TOTAL_COUNT" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Comment test result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = `${{ steps.tests.outputs.status }}` || "FAIL";
            const totalTests = `${{ steps.tests.outputs.total_tests }}` || "0";
            const icon = status === "PASS" ? "✅" : "❌";
            const body =
              `${icon} VENOM PR Check: **${status}**\n\n` +
              `Total tests observed: **${totalTests}**\n` +
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Fail job when tests fail
        if: steps.tests.outputs.status != 'PASS'
        run: exit 1
