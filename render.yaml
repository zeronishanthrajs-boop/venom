services:
  - type: web
    name: venom-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ENABLE_INMEMORY_DB
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: VENOM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-3-5-sonnet-latest
      - key: CLAUDE_PLANNER_STRICT
        value: "false"
      - key: ENABLE_CLAUDE_CVE_TAGGING
        value: "true"
      - key: CLAUDE_TAGGER_MODEL
        value: claude-3-5-haiku-latest
      - key: CLAUDE_JSON_REPAIR_MODEL
        value: claude-3-5-sonnet-latest
      - key: ENABLE_CVE_SYNC_JOB
        value: "true"
      - key: CVE_SYNC_CRON
        value: 0 2 * * *
      - key: CVE_SYNC_TIMEZONE
        value: UTC
      - key: CVE_SYNC_ON_STARTUP
        value: "true"
      - key: CVE_SYNC_STARTUP_DELAY_MS
        value: "10000"
      - key: NVD_SYNC_DAYS
        value: "1"
      - key: NVD_SYNC_LIMIT
        value: "100"
      - key: NVD_PAGE_SIZE
        value: "100"
      - key: NVD_REQUEST_TIMEOUT_MS
        value: "20000"
      - key: NVD_NO_KEY_DELAY_MS
        value: "6000"
      - key: NVD_API_KEY
        sync: false
      - key: VENOM_MONTHLY_BUDGET_USD
        value: "400"
