services:
  - type: web
    name: venom-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ENABLE_INMEMORY_DB
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: VENOM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-3-5-sonnet-latest
      - key: CLAUDE_LEARNER_MODEL
        value: claude-3-5-sonnet-latest
      - key: CLAUDE_CHAIN_MODEL
        value: claude-3-5-sonnet-latest
      - key: CLAUDE_PROMPT_EVOLVER_MODEL
        value: claude-3-5-sonnet-latest
      - key: CLAUDE_PLANNER_STRICT
        value: "false"
      - key: CLAUDE_CHAIN_ENABLED
        value: "true"
      - key: MAX_CONCURRENT_TARGETS
        value: "3"
      - key: ENABLE_PROMPT_EVOLUTION_JOB
        value: "false"
      - key: PROMPT_EVOLUTION_CRON
        value: 0 3 * * 0
      - key: PROMPT_EVOLUTION_TIMEZONE
        value: UTC
      - key: PROMPT_EVOLUTION_MIN_CONFIDENCE
        value: "0.70"
      - key: ENABLE_CLAUDE_CVE_TAGGING
        value: "true"
      - key: CLAUDE_TAGGER_MODEL
        value: claude-3-5-haiku-latest
      - key: CLAUDE_JSON_REPAIR_MODEL
        value: claude-3-5-sonnet-latest
      - key: ENABLE_CVE_SYNC_JOB
        value: "true"
      - key: CVE_SYNC_CRON
        value: 0 2 * * *
      - key: CVE_SYNC_TIMEZONE
        value: UTC
      - key: CVE_SYNC_ON_STARTUP
        value: "true"
      - key: CVE_SYNC_STARTUP_DELAY_MS
        value: "10000"
      - key: NVD_SYNC_DAYS
        value: "1"
      - key: NVD_SYNC_LIMIT
        value: "100"
      - key: NVD_PAGE_SIZE
        value: "100"
      - key: NVD_REQUEST_TIMEOUT_MS
        value: "20000"
      - key: NVD_NO_KEY_DELAY_MS
        value: "6000"
      - key: NVD_API_KEY
        sync: false
      - key: ENABLE_DOCKER_TOOLS
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ENABLE_RESEARCH_JOB
        value: "false"
      - key: RESEARCH_JOB_CRON
        value: 0 4 * * 2,5
      - key: RESEARCH_JOB_TIMEZONE
        value: UTC
      - key: RESEARCH_NVD_DAYS
        value: "2"
      - key: RESEARCH_NVD_LIMIT
        value: "40"
      - key: ENABLE_RESEARCH_PROMPT_EVOLUTION
        value: "true"
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: JIRA_API_URL
        sync: false
      - key: JIRA_PROJECT_KEY
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: VENOM_REALTIME_SECRET
        sync: false
      - key: VENOM_REALTIME_TOKEN_TTL_MS
        value: "600000"
      - key: VENOM_MONTHLY_BUDGET_USD
        value: "400"
