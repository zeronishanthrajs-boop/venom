services:
  - type: web
    name: venom-backend
    env: node
    plan: starter
    rootDir: backend
    buildCommand: >-
      bash -lc "set -euo pipefail;
      apt-get update;
      apt-get install -y --no-install-recommends nikto whatweb ffuf amass golang-go python3-pip;
      npm ci;
      python3 -m pip install --no-cache-dir sqlmap wafw00f semgrep trufflehog;
      export GOBIN=$HOME/go/bin;
      go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest;
      go install github.com/projectdiscovery/httpx/cmd/httpx@latest;
      go install github.com/projectdiscovery/katana/cmd/katana@latest;
      go install github.com/projectdiscovery/naabu/v2/cmd/naabu@latest;
      go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest;
      go install github.com/hahwul/dalfox/v2@latest;
      $HOME/go/bin/nuclei -update-templates || true"
    startCommand: PATH=$HOME/go/bin:$PATH npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ENABLE_INMEMORY_DB
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: VENOM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: API_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: API_RATE_LIMIT_MAX
        value: "300"
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: AUTH_RATE_LIMIT_MAX
        value: "5"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_RESEARCH_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_LEARNER_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_CHAIN_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_PROMPT_EVOLVER_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_PLANNER_STRICT
        value: "false"
      - key: GEMINI_CHAIN_ENABLED
        value: "true"
      - key: MAX_CONCURRENT_TARGETS
        value: "1"
      - key: MAX_CONCURRENT_MEMORY_HEAVY_TASKS
        value: "1"
      - key: ENABLE_PROMPT_EVOLUTION_JOB
        value: "false"
      - key: PROMPT_EVOLUTION_CRON
        value: 0 3 * * 0
      - key: PROMPT_EVOLUTION_TIMEZONE
        value: UTC
      - key: PROMPT_EVOLUTION_MIN_CONFIDENCE
        value: "0.70"
      - key: ENABLE_GEMINI_CVE_TAGGING
        value: "true"
      - key: GEMINI_TAGGER_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_TAGGER_TIMEOUT_MS
        value: "15000"
      - key: GEMINI_JSON_REPAIR_MODEL
        value: gemini-2.0-flash
      - key: ENABLE_CVE_SYNC_JOB
        value: "true"
      - key: CVE_SYNC_CRON
        value: 0 2 * * *
      - key: CVE_SYNC_TIMEZONE
        value: UTC
      - key: CVE_SYNC_ON_STARTUP
        value: "true"
      - key: CVE_SYNC_STARTUP_DELAY_MS
        value: "10000"
      - key: NVD_SYNC_DAYS
        value: "1"
      - key: NVD_SYNC_LIMIT
        value: "100"
      - key: NVD_PAGE_SIZE
        value: "100"
      - key: NVD_REQUEST_TIMEOUT_MS
        value: "20000"
      - key: NVD_NO_KEY_DELAY_MS
        value: "6000"
      - key: NVD_MAX_ATTEMPTS
        value: "4"
      - key: NVD_KEYED_DELAY_MS
        value: "700"
      - key: NVD_MAX_BACKOFF_MS
        value: "60000"
      - key: NVD_API_KEY
        sync: false
      - key: ENABLE_DOCKER_TOOLS
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ENABLE_RESEARCH_JOB
        value: "false"
      - key: RESEARCH_JOB_CRON
        value: 0 4 * * 2,5
      - key: RESEARCH_JOB_TIMEZONE
        value: UTC
      - key: RESEARCH_NVD_DAYS
        value: "2"
      - key: RESEARCH_NVD_LIMIT
        value: "40"
      - key: ENABLE_RESEARCH_PROMPT_EVOLUTION
        value: "true"
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: JIRA_API_URL
        sync: false
      - key: JIRA_PROJECT_KEY
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: VENOM_REALTIME_SECRET
        sync: false
      - key: VENOM_REALTIME_TOKEN_TTL_MS
        value: "600000"
      - key: VENOM_REALTIME_HEARTBEAT_MS
        value: "30000"
      - key: DEFAULT_STARTUP_PROFILE
        value: "true"
      - key: TRANSLATE_FINDINGS_ON_COMPLETE
        value: "true"
      - key: ENABLE_DECISION_BRIEF_AI
        value: "true"
      - key: GEMINI_DECISION_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_TRANSLATOR_MODEL
        value: gemini-2.0-flash
      - key: ENABLE_FINDING_TRANSLATION_AI
        value: "false"
      - key: CONTINUOUS_SCAN_ENABLED
        value: "false"
      - key: CONTINUOUS_SCAN_CRON
        value: 0 6 * * *
      - key: CONTINUOUS_SCAN_TIMEZONE
        value: UTC
      - key: VENOM_MONTHLY_BUDGET_USD
        value: "400"
